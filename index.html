<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Church Confession Online</title>
<style>
:root{--bg:#f6efe4;--card:#fff;--fg:#2a1a10;--mut:#7a6552;--gold:#c28a2c;--line:#e6d9c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1410;--card:#2a1f18;--fg:#f3e8da;--mut:#b9a28c;--line:#42342a}}
:root[data-theme="dark"]{--bg:#1c1410;--card:#2a1f18;--fg:#f3e8da;--mut:#b9a28c;--line:#42342a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:980px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{font-size:20px;margin:0}#online{font-size:13px;color:var(--mut)}#online:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:6px}
#wrap{position:relative}
canvas{width:100%;display:block;border-radius:12px;border:2px solid var(--line);background:#3a2a1a}
#feed{position:absolute;top:8px;left:0;right:0;text-align:center;pointer-events:none}
#feed div{display:inline-block;background:rgba(30,18,10,.72);color:#fff;font-size:13px;padding:4px 12px;border-radius:14px;margin:2px;animation:f 5s forwards}
@keyframes f{0%{opacity:0;transform:translateY(-6px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--gold);color:#fff;font-weight:600}
button.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
#dots{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}#dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}#dots i.on{background:#fff}
#info{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){#info{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.card h3{margin:0 0 8px;font-size:15px}.row{display:flex;justify-content:space-between;padding:3px 0}.me{color:var(--gold);font-weight:700}
.note{font-size:12px;color:var(--mut);margin:10px 2px}
#modal,#start{position:fixed;inset:0;background:rgba(20,10,5,.6);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
[hidden]{display:none!important}
.box{background:var(--card);color:var(--fg);border-radius:14px;padding:18px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.box h2{margin:0 0 8px;font-size:18px}.warn{font-size:12px;background:rgba(194,138,44,.15);border-radius:8px;padding:8px;margin-bottom:10px;color:var(--fg)}
label.ck{display:flex;gap:8px;padding:5px 0;font-size:14px}
textarea,input{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);margin:6px 0}
</style>
</head>
<body>
<div id="app">
<header><h1>⛪ Church Confession Online</h1><span id="online"></span></header>
<div id="wrap"><canvas id="c" width="800" height="480"></canvas><div id="feed"></div></div>
<div id="bar">
<button id="bPray">🙏 Hail Mary <span id="dots"></span></button>
<button id="bCandle" class="alt">🕯️ Light a Candle</button>
<button id="bConf" class="alt">✝️ Examination of Conscience</button>
</div>
<div id="info">
<div class="card"><h3>🏆 Weekly Leaderboard</h3><div id="lb"></div></div>
<div class="card"><h3>📿 Your Journey</h3><div id="st"></div></div>
</div>
<p class="note">Demo: the other worshippers are simulated. Real multiplayer needs a realtime server (WebSocket).</p>
</div>

<div id="start"><div class="box"><h2>Welcome to Church Confession Online</h2><p style="font-size:14px;margin:0">A quiet place to pray, light a candle, and reflect.</p><input id="nm" maxlength="20" placeholder="Your name"><button id="go" style="width:100%">Enter the Chapel</button></div></div>

<div id="modal" hidden><div class="box" id="mb"></div></div>

<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),W=800,H=480;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const NAMES=['Mary G.','Joseph M.','Anna K.','Peter D.','Teresa L.','Paul R.','Cecilia B.','John T.','Monica H.','Anthony S.','Lucy N.','Michael H.','Agnes T.','Vincent R.','Rose M.','Dominic P.'];
const INTS=['Peace for my family.','Healing for my mom.','Thankful for so many blessings.','Strength for my exams.','For those who have passed on.','For my parents\' health.','Help me be more patient.','Peace in the world.'];
const ROBES=['#8fb3d9','#a9c4e8','#d9d4c4','#c9a96a','#9cb8a0','#b7a3c9'],HAIRS=['#2a1a12','#3a2418','#1a1410','#5a3a22',null,'#d8c8a8'],SKINS=['#f0b48a','#e8a47a','#f5c9a0'];
let me={name:'You',total:0,decades:0,candles:0,reflect:0,beads:0},pray=0,bubble=null;
try{const s=JSON.parse(localStorage.getItem('nt_me')||'null');if(s)me={...me,...s,beads:0}}catch(e){}
const save=()=>{try{localStorage.setItem('nt_me',JSON.stringify(me))}catch(e){}};

/* seats & npcs */
const seats=[];
for(let r=0;r<4;r++){const y=268+r*54;for(let i=0;i<5;i++){seats.push({x:110+i*50,y});seats.push({x:480+i*50,y})}}
const MYSEAT=34,npcs=[];
seats.forEach((s,i)=>{if(i===MYSEAT||Math.random()<.22)return;npcs.push({x:s.x,y:s.y,name:rnd(NAMES),robe:rnd(ROBES),hair:rnd(HAIRS),skin:rnd(SKINS),pray:Math.random()<.5?Math.random()*3:0,week:20+Math.floor(Math.random()*380),b:null})});
const slots=[];for(let r=0;r<6;r++)for(let c=0;c<3;c++)slots.push({x:722+c*18,y:340+r*18,lit:Math.random()<.4});

function toast(m){const f=$('feed'),d=document.createElement('div');d.textContent=m;f.appendChild(d);setTimeout(()=>d.remove(),5000);while(f.children.length>3)f.firstChild.remove()}
function say(o,t,sec=5){o.b={t,e:performance.now()+sec*1000}}

/* drawing */
function ell(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill()}
function chibi(o,t,isMe){
  const x=o.x,y=o.y+Math.sin(t*2+x)*1;
  if(o.pray>0){ell(x,y-14,25,25,'rgba(255,225,130,.35)');ctx.strokeStyle='rgba(255,230,150,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-14,24,0,7);ctx.stroke()}
  ell(x,y+8,17,20,o.robe);ell(x,y+2,17,4,'#e0b84a');
  ell(x,y-14,15,15,o.skin);ell(x-15,y-12,3,4,o.skin);ell(x+15,y-12,3,4,o.skin);
  if(o.hair)ell(x,y-16,15.5,14,o.hair);
  if(isMe){ctx.fillStyle='#f2c500';ctx.beginPath();ctx.moveTo(x-8,y-48+Math.sin(t*4)*3);ctx.lineTo(x+8,y-48+Math.sin(t*4)*3);ctx.lineTo(x,y-38+Math.sin(t*4)*3);ctx.fill()}
}
function bub(o,txt){
  ctx.font='12px system-ui,sans-serif';const w=ctx.measureText(txt).width+16,bx=Math.max(6,Math.min(W-w-6,o.x-w/2)),by=o.y-72;
  ctx.fillStyle='rgba(255,255,255,.95)';ctx.beginPath();ctx.roundRect(bx,by,w,22,8);ctx.fill();
  ctx.fillStyle='#2a1a10';ctx.textAlign='left';ctx.fillText(txt,bx+8,by+15)
}
function label(o,txt){ctx.font='bold 11px system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText(txt,o.x+1,o.y+41);ctx.fillStyle='#fff';ctx.fillText(txt,o.x,o.y+40)}
function flame(x,y,t){const f=Math.sin(t*9+x)*1.2;ell(x,y-3,6,8,'rgba(255,190,70,.3)');ell(x,y,2.2,4+f*.5,'#ffb22e');ell(x,y+1,1.2,2.4,'#fff3b0')}
function scene(t){
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#a8732f');g.addColorStop(1,'#6b4220');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#d9c3a0';ctx.fillRect(0,0,W,172);ctx.fillStyle='#b99d74';ctx.fillRect(0,166,W,8);
  for(let i=0;i<9;i++){ctx.fillStyle='rgba(0,0,0,.05)';ctx.fillRect(i*100,0,2,166)}
  [[170],[630]].forEach(([x])=>{ctx.fillStyle='#3a2a1a';ctx.beginPath();ctx.moveTo(x-38,150);ctx.lineTo(x-38,60);ctx.arc(x,60,38,Math.PI,0);ctx.lineTo(x+38,150);ctx.fill();
    ['#d8442a','#2a6ad8','#f2c500','#2a8a4a'].forEach((c,i)=>{ctx.fillStyle=c;ctx.globalAlpha=.8;ctx.fillRect(x-32+(i%2)*33,70+Math.floor(i/2)*38,31,36);ctx.globalAlpha=1});});
  ctx.fillStyle='#3a2a1a';ctx.beginPath();ctx.arc(400,72,50,0,7);ctx.fill();
  for(let i=0;i<8;i++){ctx.fillStyle=['#d8442a','#2a6ad8','#f2c500','#2a8a4a'][i%4];ctx.globalAlpha=.85;ctx.beginPath();ctx.moveTo(400,72);ctx.arc(400,72,44,i*Math.PI/4,(i+1)*Math.PI/4);ctx.fill();ctx.globalAlpha=1}
  ctx.fillStyle='#f2c24a';ctx.fillRect(395,34,10,76);ctx.fillRect(375,56,50,10);
  ctx.fillStyle='#7a1a1a';ctx.fillRect(366,200,68,H-200);ctx.fillStyle='#d4a437';ctx.fillRect(366,200,3,H-200);ctx.fillRect(431,200,3,H-200);
  ctx.fillStyle='#fbf7ee';ctx.fillRect(330,176,140,30);ctx.fillStyle='#d4a437';ctx.fillRect(330,200,140,5);
  ell(345,170,0,0,'#fff');[[348],[452]].forEach(([x])=>{ctx.fillStyle='#f3ead6';ctx.fillRect(x-4,150,8,26);flame(x,146,t)});
  ell(400,170,12,8,'#e86a8a');ell(392,166,6,6,'#f0a0b4');ell(408,166,6,6,'#f0a0b4');
  ctx.fillStyle='#4a2a14';ctx.fillRect(712,330,80,116);
  slots.forEach(s=>{ctx.fillStyle='#f3ead6';ctx.fillRect(s.x-3,s.y,6,10);if(s.lit)flame(s.x,s.y-2,t)});
  ctx.fillStyle='#fff';ctx.font='11px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('Prayer candles',752,322);
}
function render(t){
  scene(t);
  const meO={x:seats[MYSEAT].x,y:seats[MYSEAT].y,robe:'#e8d8a0',hair:'#2a1a12',skin:'#f0b48a',pray:pray>0?1:0,b:bubble};
  const rows=[...new Set(seats.map(s=>s.y))];
  rows.forEach(y=>{
    npcs.filter(n=>n.y===y).forEach(n=>chibi(n,t,0));
    if(meO.y===y)chibi(meO,t,1);
    [[85,250],[455,250]].forEach(([x,w])=>{ctx.fillStyle='#5a3418';ctx.fillRect(x,y+14,w,12);ctx.fillStyle='#7a4a24';ctx.fillRect(x,y+14,w,4)});
  });
  label(meO,me.name);
  const now=performance.now();
  npcs.forEach(n=>{if(n.b&&n.b.e>now){label(n,n.name);bub(n,n.b.t)}});
  if(bubble&&bubble.e>now)bub(meO,bubble.t);
}

/* ui */
function stats(){
  $('dots').innerHTML=Array.from({length:10},(_,i)=>`<i class="${i<me.beads?'on':''}"></i>`).join('');
  $('st').innerHTML=`<div class="row"><span>Hail Marys</span><b>${me.total}</b></div><div class="row"><span>Decades completed</span><b>${me.decades}</b></div><div class="row"><span>Candles lit</span><b>${me.candles}</b></div><div class="row"><span>Reflections</span><b>${me.reflect}</b></div>`;
  const all=[...npcs.map(n=>({n:n.name,w:n.week})),{n:me.name,w:me.total,me:1}].sort((a,b)=>b.w-a.w).slice(0,5);
  $('lb').innerHTML=all.map((r,i)=>`<div class="row ${r.me?'me':''}"><span>${i+1}. ${r.n}</span><b>${r.w}</b></div>`).join('');
}
function doPray(){
  me.beads++;me.total++;pray=1.5;
  if(me.beads>=10){me.beads=0;me.decades++;toast('🙏 You completed a decade of the Rosary');say({},'');bubble={t:'Amen.',e:performance.now()+3000}}
  save();stats();
}
function modal(html){$('mb').innerHTML=html;$('modal').hidden=false}
const close=()=>{$('modal').hidden=true};
function candle(){
  modal(`<h2>🕯️ Light a Candle</h2><p style="font-size:14px;margin:0">What would you like to pray for?</p><textarea id="ti" rows="2" maxlength="40" placeholder="e.g. Peace for my family."></textarea><button id="ok" style="width:100%">Light candle</button> <button class="alt" id="cx" style="width:100%;margin-top:6px">Close</button>`);
  $('ok').onclick=()=>{const v=$('ti').value.trim()||rnd(INTS);const s=slots.find(s=>!s.lit)||rnd(slots);s.lit=true;me.candles++;bubble={t:v,e:performance.now()+6000};toast('🕯️ You lit a candle');save();stats();close()};
  $('cx').onclick=close;
}
const EX=['Have I made time for prayer and for God?','Have I lied or spoken badly about someone?','Have I held on to anger or resentment?','Have I been loving and respectful to my family?','Have I helped those in need?','Have I been greedy, selfish, or lazy?','Have I been honest at school and at work?','Have I treated others, and myself, with respect?'];
const WARN='<div class="warn">This is a space for reflection and does not replace the Sacrament of Reconciliation. Only a priest can grant absolution: please visit a priest at your local parish.</div>';
function conf1(){modal(`<h2>✝️ Examination of Conscience</h2>${WARN}<p style="font-size:14px;margin:0 0 6px">Take a quiet moment to look back on recent days. Check anything you would like to apologize for or change:</p>${EX.map((e,i)=>`<label class="ck"><input type="checkbox" style="width:auto;margin:2px 0">${e}</label>`).join('')}<button id="nx" style="width:100%;margin-top:8px">Continue</button> <button class="alt" id="cx" style="width:100%;margin-top:6px">Close</button>`);$('nx').onclick=conf2;$('cx').onclick=close}
function conf2(){modal(`<h2>✝️ In Your Own Words</h2>${WARN}<p style="font-size:14px;margin:0">Write what you would like to say to God. This text is <b>never saved and never sent anywhere</b>.</p><textarea id="tx" rows="5" placeholder="Dear God, ..."></textarea><button id="nx" style="width:100%">Continue</button>`);$('nx').onclick=conf3}
function conf3(){modal(`<h2>🙏 Contrition</h2><p style="font-size:14px;line-height:1.5">O God, I am truly sorry for my failings. Have mercy on me and help me to live better. Amen.</p><div class="warn">When you are ready, consider visiting a priest for the Sacrament of Reconciliation.</div><button id="ok" style="width:100%">Amen, finish</button>`);
  $('ok').onclick=()=>{me.reflect++;pray=4;toast('🕊️ You took a quiet moment to reflect');save();stats();close()}}

$('bPray').onclick=doPray;$('bCandle').onclick=candle;$('bConf').onclick=conf1;
addEventListener('keydown',e=>{if(e.code==='Space'&&$('modal').hidden&&$('start').hidden){e.preventDefault();if(!e.repeat)doPray()}});
$('nm').value=me.name==='You'?'':me.name;
$('go').onclick=()=>{me.name=$('nm').value.trim()||'You';save();$('start').hidden=true;stats()};

/* simulation */
setInterval(()=>{const n=rnd(npcs),k=Math.random();
  if(k<.45){say(n,rnd(INTS));}else if(k<.75)toast(`🙏 ${n.name} just finished a decade of the Rosary`);else if(k<.9){toast(`🕯️ ${n.name} just lit a candle`);rnd(slots).lit=true}else toast(`🕊️ ${n.name} took a quiet moment to reflect`);
  n.week+=Math.floor(Math.random()*10);n.pray=2;stats()},4500);
setInterval(()=>{$('online').textContent=(300+Math.floor(Math.random()*120))+' people online'},3000);
$('online').textContent='368 people online';
let last=performance.now();
(function loop(ts){const dt=(ts-last)/1000;last=ts;pray=Math.max(0,pray-dt);npcs.forEach(n=>{if(n.pray>0)n.pray-=dt});render(ts/1000);requestAnimationFrame(loop)})(last);
stats();
</script>
</body>
</html>
